<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Digital Flipbook</title>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: #e8edf5;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1 { color: #26334a; }

#book {
  margin: 20px auto;
}

.page {
  background: white;
  border: 1px solid #ddd;
  padding: 25px;
  box-sizing: border-box;
  overflow: hidden;
}

.page h2 {
  color: #284a83;
}

.cover {
  background: #24477e;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.cover h2 { color: white; }

.controls {
  display: flex;
  gap: 15px;
}

button {
  background: #24477e;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 24px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>My Digital Flipbook</h1>

<div id="book">

  <div class="page cover" data-density="hard">
    <h2>MY FIRST BOOK</h2>
    <p>Digital Edition 2026</p>
  </div>

  <div class="page">
    <h2>Page 1</h2>
    <p>Welcome to my digital book.</p>
  </div>

  <div class="page">
    <h2>Page 2</h2>
    <p>This book has realistic turning pages.</p>
  </div>

  <div class="page">
    <h2>Page 3</h2>
    <p>You can add your own text and images.</p>
  </div>

  <div class="page">
    <h2>Page 4</h2>
    <p>Each HTML page becomes a book page.</p>
  </div>

  <div class="page cover" data-density="hard">
    <h2>THE END</h2>
  </div>

</div>

<div class="controls">
  <button onclick="book.flipPrev()">Previous</button>
  <button onclick="book.flipNext()">Next</button>
</div>

<script>
const book = new St.PageFlip(
  document.getElementById("book"),
  {
    width: 350,
    height: 480,
    size: "stretch",
    minWidth: 220,
    maxWidth: 350,
    minHeight: 300,
    maxHeight: 480,
    showCover: true,
    usePortrait: true,
    flippingTime: 900,
    maxShadowOpacity: 0.5,
    mobileScrollSupport: false
  }
);

book.loadFromHTML(
  document.querySelectorAll(".page")
);
</script>

</body>
</html>
